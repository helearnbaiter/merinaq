[package]
name = "data-processing-platform"
version = "0.1.0"
edition = "2021"
authors = ["Data Processing Team"]
description = "Modern data processing platform built with Rust"
license = "MIT"

[dependencies]
# Web framework
axum = { version = "0.8.7", features = ["macros"] }
tokio = { version = "1.48.0", features = ["full"] }
tower = { version = "0.5.2", features = ["full"] }
tower-http = { version = "0.6.7", features = ["cors", "fs", "trace"] }

# Configuration
config = "0.15.19"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

# Authentication & Authorization
casbin = { version = "2.17.0", features = [ "runtime-async-std"] }
jsonwebtoken = "10.2.0"
oauth2 = "5.0.0"
uuid = { version = "1.18.1", features = ["v4","v7", "serde"] }

# Database
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "mysql", "sqlite", "chrono", "uuid", "json"] }
sea-orm = { version = "1.1.19", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }

# Data processing
datafusion = { version = "51.0.0", features = ["parquet", "crypto_expressions", "regex_expressions"] }
arrow = { version = "52.2", features = ["prettyprint"] }
parquet = "52.2"
iceberg = "0.7.0"
ballista = "50.0.0"

# HTTP client
reqwest = { version = "0.12.24", features = ["json"] }

# Utilities
thiserror = "2.0.17"
anyhow = "1.0.100"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
futures = "0.3.31"
async-trait = "0.1.89"
chrono = { version = "0.4.42", features = ["serde"] }
url = "2.5.7"

# Metrics and monitoring
prometheus = { version = "0.14.0", features = ["process", "push"] }
lazy_static = "1.5.0"

# Flight SQL and ADBC
arrow-flight = "57.1.0"
tonic = { version = "0.14.2", features = ["transport", "codegen"] }
prost = "0.14.1"
tokio-stream = "0.1.17"
bincode = "2.0.1"

# Cryptography
bcrypt = "0.17.1"
rand = "0.9.2"

[dev-dependencies]
tokio-test = "0.4.4"