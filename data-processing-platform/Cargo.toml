[package]
name = "data-processing-platform"
version = "0.1.0"
edition = "2021"
authors = ["Data Processing Team"]
description = "Modern data processing platform built with Rust"
license = "MIT"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1.0", features = ["full"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "fs", "trace"] }

# Configuration
config = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Authentication & Authorization
casbin = { version = "2.1", features = ["adapter", "database-adapter", "runtime-async-std"] }
jsonwebtoken = "9.3"
oauth2 = "0.21"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "mysql", "sqlite", "chrono", "uuid", "json"] }
sea-orm = { version = "1.0", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }

# Data processing
datafusion = { version = "40.0", features = ["parquet", "json", "crypto_expressions", "regex_expressions"] }
arrow = { version = "52.2", features = ["prettyprint"] }
parquet = "52.2"
rust-iceberg = { version = "0.3", features = ["catalog", "io"] }
ballista = { version = "0.13", features = ["standalone", "client"] }

# HTTP client
reqwest = { version = "0.11", features = ["json"] }

# Utilities
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
url = "2.0"
fxhash = "0.2"

# Metrics and monitoring
prometheus = { version = "0.13", features = ["process", "push"] }
lazy_static = "1.4"

# Flight SQL and ADBC
arrow-flight = "52.2"
flight-sql = "52.2"
adbc = "52.2"
tonic = { version = "0.10", features = ["transport", "codegen", "prost"] }
prost = "0.12"
tokio-stream = "0.1"
bincode = "1.3"

# Cryptography
bcrypt = "0.15"
rand = "0.8"

[dev-dependencies]
tokio-test = "0.4"