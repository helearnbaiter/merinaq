# Base Configuration for Data Processing Platform

[app]
name = "Data Processing Platform"
version = "1.0.0"
description = "Modern data processing platform built with Rust"
debug = false
log_level = "INFO"

[server]
host = "0.0.0.0"
port = 8080
timeout = 30

[database]
url = "${DATABASE_URL}"
pool_size = 20
connection_timeout = 30
max_connections = 50

[auth]
jwt_secret = "your-super-secret-jwt-key-change-this-in-production"
jwt_expiration = 3600
refresh_token_expiration = 86400

[auth.google]
client_id = "your-google-client-id"
client_secret = "your-google-client-secret"

[auth.github]
client_id = "your-github-client-id"
client_secret = "your-github-client-secret"

[auth.facebook]
client_id = "your-facebook-client-id"
client_secret = "your-facebook-client-secret"

[query_engine]
max_concurrent_queries = 100
query_timeout = 300  # 5 minutes
result_cache_ttl = 300  # 5 minutes
memory_limit = "1GB"
enable_query_cache = true
enable_query_optimization = true

[logging]
level = "INFO"
format = "json"
file_path = "logs/app.log"
enable_syslog = false

[monitoring]
enabled = true
metrics_endpoint = "/metrics"
tracing_enabled = false
tracing_endpoint = ""

[security]
enable_cors = true
allowed_origins = ["http://localhost:3000", "http://localhost:8080"]
enable_rate_limiting = true
rate_limit_requests = 100
rate_limit_window = 60  # seconds
enable_request_logging = true
ssl_required = false

[performance]
connection_pool_monitoring = true
query_performance_monitoring = true
slow_query_threshold = 5000  # milliseconds