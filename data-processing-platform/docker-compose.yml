version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - RUN_MODE=development
      - APP_SERVER__HOST=0.0.0.0
      - APP_SERVER__PORT=8080
      - APP_DATABASE__URL=postgresql://postgres:password@db:5432/data_platform
      - APP_AUTH__JWT_SECRET=mysecretkey
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ./config:/app/config:ro

  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=data_platform
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database_init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data: